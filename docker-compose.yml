services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agroalerta
      POSTGRES_USER: agroalerta
      POSTGRES_PASSWORD: agroalerta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroalerta -d agroalerta"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://agroalerta:agroalerta@db:5432/agroalerta
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-openmeteo}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/index.html:/app/index.html
      - ./frontend/app.js:/app/app.js
      - ./frontend/styles.css:/app/styles.css
    depends_on:
      - backend

volumes:
  postgres_data: