services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agroalerta
      POSTGRES_USER: agroalerta
      POSTGRES_PASSWORD: agroalerta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroalerta -d agroalerta"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      DATABASE_URL: postgres://agroalerta:agroalerta@db:5432/agroalerta
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: